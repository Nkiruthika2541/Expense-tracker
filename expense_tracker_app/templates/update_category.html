{% extends 'home.html' %}

{% block title %} Update Category {% endblock %}

{% block content %}
<h2>Update Category Form</h2>
<form method="post">
  {% csrf_token %}
  
  {{ form.non_field_errors }}
  
  {% for field in form %}
    <div>
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  
  <button type="submit">Update</button>
</form>
{% endblock %}
